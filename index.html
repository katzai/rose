<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crimson Rose — Pure Web Magic</title>
<style>
:root{--red:#ff153d;--white:#f3eef0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030102;color:var(--white);font-family:Inter,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 47%,transparent 28%,rgba(0,0,0,.24) 68%,rgba(0,0,0,.9) 130%);z-index:2}
.top{position:fixed;z-index:3;top:4.2%;left:3%;display:flex;align-items:center;gap:22px;letter-spacing:.22em;font-size:13px;color:#ddd}
.logo{font-size:42px;font-weight:900;line-height:1;color:#ff2449;letter-spacing:-.1em;text-shadow:0 0 20px #ff003b}
.sep{height:26px;width:1px;background:#666}
.pill{position:fixed;z-index:3;right:3%;top:4.5%;border:1px solid #393035;border-radius:30px;padding:12px 18px;background:#090609a8;font-size:13px;color:#ddd;backdrop-filter:blur(12px)}
.pill i{display:inline-block;width:8px;height:8px;background:#ff1744;border-radius:50%;margin-right:10px;box-shadow:0 0 12px #ff1744}
.hero-copy{position:fixed;z-index:3;left:3%;top:31%;font-weight:300;font-size:clamp(23px,2.2vw,36px);letter-spacing:-.04em;text-shadow:0 2px 15px #000}
.hero-copy em{font-style:normal;color:#ff2347}
.sub{font-size:clamp(12px,1.1vw,17px);margin-top:8px;color:#d5cdd1;letter-spacing:0}
.bottom{position:fixed;z-index:3;bottom:4.8%;left:3%;right:3%;display:flex;align-items:center;justify-content:space-between;color:#d8cfd3;font-size:14px}
.scroll{display:flex;align-items:center;gap:14px}
.mouse{width:19px;height:30px;border:1px solid #ddd;border-radius:12px;position:relative}
.mouse:after{content:"";position:absolute;width:2px;height:6px;left:8px;top:5px;background:#fff;border-radius:2px}
.credit{display:flex;align-items:center;gap:12px}
.credit:before{content:"";width:min(17vw,260px);height:1px;background:linear-gradient(90deg,transparent,#eee)}
.heart{color:#ff1744;font-size:21px}
.hint{position:fixed;z-index:3;bottom:11%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:#8d747c;opacity:.7;text-transform:uppercase}
@media(max-width:650px){.top{gap:10px;font-size:9px}.logo{font-size:32px}.pill{font-size:10px;padding:9px 12px}.hero-copy{top:20%;left:6%}.bottom{left:6%;right:6%;font-size:11px}.credit:before{width:25px}.hint{bottom:13%}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="top"><div class="logo">K</div><div class="sep"></div><span>HTML</span><div class="sep"></div><span>CSS</span><div class="sep"></div><span>JS</span></div>
<div class="pill"><i></i>Interactive&nbsp; · &nbsp;3D&nbsp; · &nbsp;Responsive</div>
<div class="hero-copy">Pure Web <em>Magic</em><div class="sub">Crafted with HTML, CSS &amp; JavaScript <span class="heart">♥</span></div></div>
<div class="hint">Move your pointer to explore the rose</div>
<div class="bottom"><div class="scroll"><div class="mouse"></div><span>Scroll to explore</span></div><div class="credit">Built with Passion <span class="heart">♥</span></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030102);scene.fog=new THREE.FogExp2(0x090105,.045);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,2.25,10.7);
const root=new THREE.Group();scene.add(root);const flower=new THREE.Group();root.add(flower);
scene.add(new THREE.HemisphereLight(0x8b1831,0x080307,1.15));
const key=new THREE.DirectionalLight(0xffd5df,3.5);key.position.set(-4,7,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const redLight=new THREE.PointLight(0xff003b,95,12,2);redLight.position.set(1.8,2.2,1.2);scene.add(redLight);
const rim=new THREE.PointLight(0xff1749,75,14,2);rim.position.set(-4,1.4,-2);scene.add(rim);
const fill=new THREE.PointLight(0x5424ff,22,12,2);fill.position.set(4,3,-3);scene.add(fill);
const stemMat=new THREE.MeshStandardMaterial({color:0x170d13,metalness:.58,roughness:.27,emissive:0x26000b,emissiveIntensity:.45});
const petalMat=new THREE.MeshPhysicalMaterial({color:0x650016,metalness:.32,roughness:.19,clearcoat:1,clearcoatRoughness:.08,side:THREE.DoubleSide});
const petalInner=new THREE.MeshPhysicalMaterial({color:0x9b001f,metalness:.2,roughness:.16,clearcoat:1,clearcoatRoughness:.06,side:THREE.DoubleSide});
const leafMat=new THREE.MeshPhysicalMaterial({color:0x080b0d,metalness:.66,roughness:.23,clearcoat:.9,side:THREE.DoubleSide});
function tube(points,r,mat,segments=64){const curve=new THREE.CatmullRomCurve3(points);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,r,8,false),mat);mesh.castShadow=true;flower.add(mesh);return mesh;}
function makePetal(angle,layer,index){
 const rows=28,cols=28,verts=[],uv=[],indices=[];const width=(.48+layer*.12)*(1-.035*index),length=.82+layer*.12;
 for(let i=0;i<=rows;i++){const v=i/rows;for(let j=0;j<=cols;j++){const u=j/cols*2-1,flare=Math.pow(Math.sin(Math.PI*v),.72),w=width*flare*(.78+.22*Math.cos(u*Math.PI/2)),x=u*w,cup=.24*u*u+.12*Math.sin(v*Math.PI)+.12*Math.pow(Math.abs(u),3),curl=.14*Math.pow(v,3)*u*u,z=cup+curl-.12*Math.sin(v*Math.PI),twist=.08*Math.sin(v*Math.PI*1.3)*u;verts.push(x*Math.cos(angle)-length*v*Math.sin(angle)+twist*Math.cos(angle),x*Math.sin(angle)+length*v*Math.cos(angle)+twist*Math.sin(angle),z);uv.push(j/cols,i/rows);if(i<rows&&j<cols){const a=i*(cols+1)+j,b=a+cols+1;indices.push(a,b,a+1,b,b+1,a+1);}}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(indices);g.computeVertexNormals();
 const m=new THREE.Mesh(g,layer===0?petalInner:petalMat);m.position.set(0,1.45+layer*.045,0);m.rotation.x=-.22+layer*.06;m.castShadow=true;m.receiveShadow=true;flower.add(m);
 const edgePts=[];for(let k=0;k<=28;k++){const v=k/28,w=width*Math.pow(Math.sin(Math.PI*v),.72);edgePts.push(new THREE.Vector3(w*Math.cos(angle)-length*v*Math.sin(angle),w*Math.sin(angle)+length*v*Math.cos(angle),.17));}
 const edge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edgePts),40,.008,5,false),new THREE.MeshBasicMaterial({color:0xff183f,transparent:true,opacity:.48}));edge.position.copy(m.position);flower.add(edge);
}
for(let layer=0;layer<5;layer++){const count=[5,7,9,11,13][layer];for(let i=0;i<count;i++)makePetal(i/count*Math.PI*2+layer*.24,layer,i);}
for(let i=0;i<7;i++)makePetal(i/7*Math.PI*2,0,i);
tube([new THREE.Vector3(0,1.55,0),new THREE.Vector3(.05,.7,-.03),new THREE.Vector3(-.04,-.25,0),new THREE.Vector3(.02,-1.2,-.05),new THREE.Vector3(0,-1.8,0)],.055,stemMat,80);
for(let i=0;i<5;i++){const a=i/5*Math.PI*2,p1=new THREE.Vector3(0,1.42,0),p2=new THREE.Vector3(Math.cos(a)*.46,1.72,Math.sin(a)*.46),p3=new THREE.Vector3(Math.cos(a)*.72,1.58,Math.sin(a)*.72);tube([p1,p2,p3],.025,leafMat,24);}
function leaf(angle,y,scale){const g=new THREE.BufferGeometry(),v=[],idx=[],nx=20,ny=12;for(let i=0;i<=ny;i++){let t=i/ny;for(let j=0;j<=nx;j++){let u=j/nx*2-1,w=Math.sin(Math.PI*t)*.38*scale,x=u*w,yy=t*1.45*scale,z=.17*(1-u*u)*Math.sin(Math.PI*t)+.12*Math.sin(t*Math.PI);v.push(x*Math.cos(angle)-yy*Math.sin(angle),x*Math.sin(angle)+yy*Math.cos(angle),z);if(i<ny&&j<nx){let a=i*(nx+1)+j,b=a+nx+1;idx.push(a,b,a+1,b,b+1,a+1);}}}g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();const mesh=new THREE.Mesh(g,leafMat);mesh.position.y=y;mesh.castShadow=true;flower.add(mesh);const vein=[];for(let i=0;i<=20;i++){let t=i/20;vein.push(new THREE.Vector3(0,1.45*scale*t,.19*Math.sin(Math.PI*t)));}const vm=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(vein),30,.009,5,false),new THREE.MeshBasicMaterial({color:0x8f0926}));vm.position.copy(mesh.position);flower.add(vm);}
leaf(-1.12,-.65,1);leaf(1.45,-.25,.85);leaf(2.8,-1.05,.72);
for(let q=0;q<3;q++){const pts=[];for(let i=0;i<=220;i++){let t=i/220*Math.PI*3.4,y=-1.25+i/220*3.7,r=1.05+.2*Math.sin(t*.8+q);pts.push(new THREE.Vector3(Math.cos(t+q*2.1)*r,y,Math.sin(t+q*2.1)*r));}const mat=new THREE.MeshBasicMaterial({color:q===1?0xff3155:0xff092e,transparent:true,opacity:q===1?.5:.72});flower.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),400,.009,5,false),mat));}
const floor=new THREE.Mesh(new THREE.CircleGeometry(18,128),new THREE.MeshPhysicalMaterial({color:0x080407,metalness:.85,roughness:.16,clearcoat:1,clearcoatRoughness:.05}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.85;floor.receiveShadow=true;scene.add(floor);
for(let i=0;i<9;i++){let ring=new THREE.Mesh(new THREE.TorusGeometry(.55+i*.18,.008,6,160),new THREE.MeshBasicMaterial({color:0xff123c,transparent:true,opacity:.34-i*.025}));ring.rotation.x=Math.PI/2;ring.position.set(0,-1.82+i*.0005,0);ring.scale.set(1.35,1,1);scene.add(ring);}
const dropGeo=new THREE.SphereGeometry(1,12,10),dropMat=new THREE.MeshPhysicalMaterial({color:0xf4a8bb,metalness:.1,roughness:.035,transmission:.25,thickness:.6,clearcoat:1,clearcoatRoughness:.02}),drops=new THREE.Group();flower.add(drops);
for(let i=0;i<150;i++){const a=Math.random()*Math.PI*2,r=.28+Math.random()*1.2,y=.9+Math.random()*1.15,d=new THREE.Mesh(dropGeo,dropMat),s=.012+Math.random()*.032;d.scale.set(s,s*(1.2+Math.random()),s);d.position.set(Math.cos(a)*r,y,Math.sin(a)*r*.6+.16);drops.add(d);}
const particleCount=1300,positions=new Float32Array(particleCount*3);for(let i=0;i<particleCount;i++){positions[i*3]=(Math.random()-.5)*10;positions[i*3+1]=(Math.random()-.45)*6;positions[i*3+2]=(Math.random()-.5)*6;}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(positions,3));const pm=new THREE.PointsMaterial({color:0xff234b,size:.025,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}),dust=new THREE.Points(pg,pm);scene.add(dust);
const floaters=[];for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.1,12,8),new THREE.MeshBasicMaterial({color:0xa90028,transparent:true,opacity:.8}));m.scale.set(1.3,.35,.12);m.position.set((Math.random()-.5)*5,Math.random()*4-1,(Math.random()-.5)*3);scene.add(m);floaters.push({m,speed:.2+Math.random()*.35,phase:Math.random()*6});}
let pointerX=0,pointerY=0,targetX=0,targetY=0,scroll=0;
addEventListener('pointermove',e=>{pointerX=(e.clientX/innerWidth-.5)*2;pointerY=(e.clientY/innerHeight-.5)*2;});
addEventListener('wheel',e=>{scroll=Math.max(-.8,Math.min(.8,scroll+e.deltaY*.0005));},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();targetX+=(pointerX-targetX)*.025;targetY+=(pointerY-targetY)*.025;flower.rotation.y=targetX*.22+Math.sin(t*.18)*.035;flower.rotation.x=-targetY*.09;root.position.y=Math.sin(t*.65)*.055-scroll*.25;root.rotation.z=Math.sin(t*.25)*.012;camera.position.x=targetX*.28;camera.position.y=2.25-targetY*.18;camera.lookAt(0,.05,0);redLight.intensity=88+Math.sin(t*2.2)*12;dust.rotation.y=t*.018;const arr=pg.attributes.position.array;for(let i=0;i<particleCount;i++){arr[i*3+1]+=.002+(i%5)*.0003;if(arr[i*3+1]>3.5)arr[i*3+1]=-3.5;}pg.attributes.position.needsUpdate=true;floaters.forEach(o=>{o.m.position.y-=o.speed*.008;o.m.position.x+=Math.sin(t+o.phase)*.002;o.m.rotation.z+=.002;if(o.m.position.y< -2.5){o.m.position.y=3.5;o.m.position.x=(Math.random()-.5)*5;}});renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
