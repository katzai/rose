<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050104">
<title> </title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050104}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 25%,rgba(4,0,2,.28) 66%,rgba(0,0,0,.78) 120%)}
</style>
</head>
<body>
<canvas id="rose"></canvas><div id="shade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#rose');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.22;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050104);
scene.fog=new THREE.FogExp2(0x080207,.035);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.05,10.8);

scene.add(new THREE.HemisphereLight(0x9a344e,0x090408,1.25));
const key=new THREE.DirectionalLight(0xffd7dc,3.4);key.position.set(-4,7,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const warm=new THREE.PointLight(0xff1745,70,13,2);warm.position.set(2,2.5,2);scene.add(warm);
const rim=new THREE.PointLight(0xff4967,65,15,2);rim.position.set(-4,2,-3);scene.add(rim);
const cool=new THREE.PointLight(0x55203b,18,12,2);cool.position.set(4,-1,3);scene.add(cool);

const root=new THREE.Group();scene.add(root);
const bloom=new THREE.Group();bloom.position.y=1.52;root.add(bloom);

function makePetalTexture(){
 const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#27000b');g.addColorStop(.22,'#8e001d');g.addColorStop(.58,'#c20b32');g.addColorStop(1,'#41000f');x.fillStyle=g;x.fillRect(0,0,512,512);
 const glow=x.createRadialGradient(250,190,12,250,230,330);glow.addColorStop(0,'rgba(255,105,130,.38)');glow.addColorStop(.5,'rgba(255,25,65,.08)');glow.addColorStop(1,'rgba(10,0,4,.34)');x.fillStyle=glow;x.fillRect(0,0,512,512);
 for(let i=0;i<17000;i++){const px=Math.random()*512,py=Math.random()*512,a=Math.random()*.075;x.fillStyle=Math.random()>.5?'rgba(255,190,195,'+a+')':'rgba(20,0,7,'+a+')';x.fillRect(px,py,1+Math.random()*2,1+Math.random()*2);}
 for(let i=0;i<34;i++){const px=256+(Math.random()-.5)*90,py=490; x.beginPath();x.moveTo(px,py);x.bezierCurveTo(px+(Math.random()-.5)*100,350,px+(Math.random()-.5)*160,150,256+(Math.random()-.5)*170,12);x.strokeStyle='rgba(255,135,155,'+(Math.random()*.075)+')';x.lineWidth=.6+Math.random()*1.4;x.stroke();}
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;return tex;
}
const petalTexture=makePetalTexture();
const petalMaterial=new THREE.MeshPhysicalMaterial({map:petalTexture,bumpMap:petalTexture,bumpScale:.045,roughness:.27,metalness:.08,clearcoat:1,clearcoatRoughness:.16,side:THREE.DoubleSide});
const innerMaterial=new THREE.MeshPhysicalMaterial({color:0x8e001c,map:petalTexture,bumpMap:petalTexture,bumpScale:.035,roughness:.22,metalness:.06,clearcoat:1,side:THREE.DoubleSide});
const stemMaterial=new THREE.MeshStandardMaterial({color:0x12351d,roughness:.34,metalness:.12});
const leafMaterial=new THREE.MeshPhysicalMaterial({color:0x12351b,roughness:.3,metalness:.12,clearcoat:.8,side:THREE.DoubleSide});

function createPetalGeometry(width,length,cup){
 const rows=36,cols=32,positions=[],uvs=[],indices=[];
 for(let i=0;i<=rows;i++){
  const v=i/rows;
  for(let j=0;j<=cols;j++){
   const u=j/cols*2-1;
   const flare=Math.pow(Math.sin(Math.PI*v),.72);
   const w=width*flare*(.78+.22*Math.cos(u*Math.PI/2));
   const x=u*w;
   const y=length*v;
   const z=cup*(.25*u*u+.55*Math.sin(v*Math.PI))+.2*Math.pow(v,3)*u*u+.055*Math.sin(v*Math.PI*2)*u;
   positions.push(x,y,z);uvs.push(j/cols,1-v);
   if(i<rows&&j<cols){const a=i*(cols+1)+j,b=a+cols+1;indices.push(a,b,a+1,b,b+1,a+1);}
  }
 }
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));geo.setIndex(indices);geo.computeVertexNormals();return geo;
}

const petals=[];
function addPetal(angle,layer,index,count){
 const outer=layer>=2;
 const width=outer?(.72+layer*.055):(.48+layer*.035);
 const length=outer?(1.18+layer*.06):(.95+layer*.035);
 const group=new THREE.Group();
 group.rotation.y=angle;
 const mesh=new THREE.Mesh(createPetalGeometry(width,length,outer?.34:.27),layer===0?innerMaterial:petalMaterial);
 mesh.castShadow=true;mesh.receiveShadow=true;
 // Petals grow from the heart; the tip curls outward as the flower opens.
 mesh.rotation.x=outer?-.12:.12;
 mesh.position.set(0,0,0);
 group.add(mesh);
 const edgePoints=[];
 for(let k=0;k<=30;k++){const v=k/30;const w=width*Math.pow(Math.sin(Math.PI*v),.72);edgePoints.push(new THREE.Vector3(w*Math.cos(Math.PI/2),length*v,.0));}
 const edgeGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edgePoints),48,.006,5,false);
 const edge=new THREE.Mesh(edgeGeo,new THREE.MeshBasicMaterial({color:0xff5272,transparent:true,opacity:.12}));edge.position.z=.018;group.add(edge);
 bloom.add(group);
 const closed=outer?-.42-(layer-2)*.05:.18+layer*.13;
 const open=outer?-.95-(layer-2)*.035:.12+layer*.16;
 group.position.y=outer?-.12+layer*.025:0;
 group.rotation.z=closed;
 group.scale.setScalar(.04);
 petals.push({group,closed,open,delay:layer*.19+index/count*.11,layer});
}
const counts=[6,8,10,12,14];
for(let layer=0;layer<counts.length;layer++){
 for(let i=0;i<counts[layer];i++)addPetal(i/counts[layer]*Math.PI*2+layer*.31,layer,i,counts[layer]);
}

// Curled central petals form the recognizable spiral heart of the rose.
for(let i=0;i<5;i++){
 const g=new THREE.Group();g.rotation.y=i/5*Math.PI*2;
 const m=new THREE.Mesh(createPetalGeometry(.34,.72,.3),innerMaterial);
 m.rotation.x=.22;m.rotation.z=.42+i*.035;m.position.set(0,.015,0);g.add(m);g.scale.setScalar(.035);bloom.add(g);
 petals.push({group:g,closed:.28,open:.12,delay:.55+i*.12,layer:0});
}

function tube(parent,points,r,material,segments=64){const curve=new THREE.CatmullRomCurve3(points);const m=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,r,8,false),material);m.castShadow=true;parent.add(m);return m;}
const stem=new THREE.Group();root.add(stem);
tube(stem,[new THREE.Vector3(0,1.52,0),new THREE.Vector3(.035,.75,-.025),new THREE.Vector3(-.045,-.2,0),new THREE.Vector3(.025,-1.05,-.04),new THREE.Vector3(0,-1.9,0)],.052,stemMaterial,90);
function makeLeaf(angle,y,scale){
 const group=new THREE.Group();group.rotation.y=angle;group.position.y=y;stem.add(group);
 const geo=createPetalGeometry(.34*scale,1.38*scale,.14);
 const leaf=new THREE.Mesh(geo,leafMaterial);leaf.castShadow=true;leaf.rotation.x=-.08;group.add(leaf);
 const veinPts=[];for(let i=0;i<=24;i++){const t=i/24;veinPts.push(new THREE.Vector3(0,1.38*scale*t,.145*Math.sin(Math.PI*t)*scale));}
 tube(group,veinPts,.008,new THREE.MeshStandardMaterial({color:0x527b40,roughness:.5}),30);
 group.rotation.z=angle*.06;
}
makeLeaf(-1.05,-.48,1.05);makeLeaf(1.3,-.12,.88);makeLeaf(2.65,-1.0,.76);

const ground=new THREE.Mesh(new THREE.CircleGeometry(22,128),new THREE.MeshPhysicalMaterial({color:0x090509,metalness:.7,roughness:.22,clearcoat:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-1.92;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<7;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.7+i*.19,.006,6,150),new THREE.MeshBasicMaterial({color:0x8c092b,transparent:true,opacity:.22-i*.022}));ring.rotation.x=Math.PI/2;ring.position.y=-1.9+i*.0005;ring.scale.set(1.2,1,1);scene.add(ring);}

// Fine dew beads sit on the petals and catch the rim light.
const dewGroup=new THREE.Group();bloom.add(dewGroup);
const dewMaterial=new THREE.MeshPhysicalMaterial({color:0xffb9c8,roughness:.025,metalness:0,transmission:.42,thickness:.8,clearcoat:1});
for(let i=0;i<105;i++){const a=Math.random()*Math.PI*2,r=.25+Math.random()*.83,y=.15+Math.random()*.72;const d=new THREE.Mesh(new THREE.SphereGeometry(.012+Math.random()*.022,12,10),dewMaterial);d.scale.set(.8,1.2,.65);d.position.set(Math.cos(a)*r,y,Math.sin(a)*r*.72+.12);dewGroup.add(d);}

const dustCount=1000,positions=new Float32Array(dustCount*3);
for(let i=0;i<dustCount;i++){positions[i*3]=(Math.random()-.5)*9;positions[i*3+1]=(Math.random()-.5)*7;positions[i*3+2]=(Math.random()-.5)*5;}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xff3157,size:.018,transparent:true,opacity:.58,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(dust);

let px=0,py=0,tx=0,ty=0;
addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));});

const clock=new THREE.Clock();
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 // Opening sequence: the bud expands from a tight crimson core into layered rose petals.
 for(const p of petals){
  const q=Math.max(0,Math.min(1,(t-1.1-p.delay)/2.7));
  const e=ease(q);
  p.group.scale.setScalar(.035+e*.965);
  p.group.rotation.z=p.closed+(p.open-p.closed)*e;
  p.group.rotation.x=(p.layer>=2?-.12:.12)+(p.layer>=2?-.22:.06)*e;
 }
 tx+=(px-tx)*.025;ty+=(py-ty)*.025;
 bloom.rotation.y=tx*.16+Math.sin(t*.2)*.025;
 bloom.rotation.x=-ty*.065;
 root.position.y=Math.sin(t*.65)*.035;
 root.rotation.z=Math.sin(t*.22)*.008;
 camera.position.x=tx*.22;camera.position.y=2.05-ty*.13;camera.lookAt(0,.05,0);
 warm.intensity=66+Math.sin(t*2)*8;
 dust.rotation.y=t*.012;
 const a=dustGeo.attributes.position.array;
 for(let i=0;i<dustCount;i++){a[i*3+1]+=.0015;if(a[i*3+1]>3.8)a[i*3+1]=-3.8;}
 dustGeo.attributes.position.needsUpdate=true;
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
